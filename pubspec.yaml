name: nrtracker
description: Credit and click tracker for Netrunner

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # version pinned by flutter_localizations
  url_launcher: ^6.3.1 # About dialog links
  package_info_plus: ^8.3.0 # version number in About
  provider: ^6.0.1
  vector_graphics: ^1.1.19 # NSG symbols
  shared_preferences: ^2.0.15
  # 1.4+ needs a newer AGP/Kotlin than this project is on
  wakelock_plus: ">=1.3.2 <1.4.0"


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  vector_graphics_compiler: ^1.1.19 # compiles the SVGs at build time

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# flutter pub run flutter_launcher_icons:main
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true # l10n, see l10n.yaml

  assets:
    # NSG symbols, CC BY-ND 4.0, compiled at build time. Listed individually so only the ones we use get bundled
    - path: assets/nsg/NSG_5_CREDITS.svg
      transformers:
        - package: vector_graphics_compiler
    - path: assets/nsg/NSG_ADVANCEMENT_COUNTER.svg
      transformers:
        - package: vector_graphics_compiler
    - path: assets/nsg/NSG_ADVANCEMENT_COUNTER_REVERSE.svg
      transformers:
        - package: vector_graphics_compiler
    - path: assets/nsg/NSG_AGENDA.svg
      transformers:
        - package: vector_graphics_compiler
    - path: assets/nsg/NSG_BAD_PUBLICITY.svg
      transformers:
        - package: vector_graphics_compiler
    - path: assets/nsg/NSG_CLICK_BLUE.svg
      transformers:
        - package: vector_graphics_compiler
    - path: assets/nsg/NSG_CLICK_SPENT.svg
      transformers:
        - package: vector_graphics_compiler
    - path: assets/nsg/NSG_CORE_DAMAGE.svg
      transformers:
        - package: vector_graphics_compiler
    - path: assets/nsg/NSG_CREDIT.svg
      transformers:
        - package: vector_graphics_compiler
    - path: assets/nsg/NSG_GENERIC_COUNTER_BLUE.svg
      transformers:
        - package: vector_graphics_compiler
    - path: assets/nsg/NSG_GENERIC_COUNTER_GREEEN.svg
      transformers:
        - package: vector_graphics_compiler
    - path: assets/nsg/NSG_INTERRUPT.svg
      transformers:
        - package: vector_graphics_compiler
    - path: assets/nsg/NSG_Mu.svg
      transformers:
        - package: vector_graphics_compiler
    - path: assets/nsg/NSG_RECURRING_CREDIT.svg
      transformers:
        - package: vector_graphics_compiler
    - path: assets/nsg/NSG_TAG.svg
      transformers:
        - package: vector_graphics_compiler
    - path: assets/nsg/NSG_VIRUS_COUNTER.svg
      transformers:
        - package: vector_graphics_compiler
    - assets/nsg/glyphs/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  fonts:
    # App font, OFL
    - family: Urbanist
      fonts:
        - asset: assets/fonts/urbanist/Urbanist-Regular.ttf
        - asset: assets/fonts/urbanist/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/urbanist/Urbanist-Bold.ttf
          weight: 700
    # Side fonts, see lib/netrunner/fonts.dart. All OFL, licence in each folder. Cinzel and Oxanium are static
    # cuts of the variable fonts; those and Comic Relief are trimmed to Latin
    - family: Cinzel
      fonts:
        - asset: assets/fonts/cinzel/Cinzel-Regular.ttf
        - asset: assets/fonts/cinzel/Cinzel-Bold.ttf
          weight: 700
    - family: Monoton
      fonts:
        - asset: assets/fonts/monoton/Monoton-Regular.ttf
    - family: NovaCut
      fonts:
        - asset: assets/fonts/novacut/NovaCut-Regular.ttf
    - family: Oxanium
      fonts:
        - asset: assets/fonts/oxanium/Oxanium-Regular.ttf
        - asset: assets/fonts/oxanium/Oxanium-Bold.ttf
          weight: 700
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/sharetechmono/ShareTechMono-Regular.ttf
    - family: Shojumaru
      fonts:
        - asset: assets/fonts/shojumaru/Shojumaru-Regular.ttf
    - family: Wallpoet
      fonts:
        - asset: assets/fonts/wallpoet/Wallpoet-Regular.ttf
    - family: ComicRelief
      fonts:
        - asset: assets/fonts/comicrelief/ComicRelief-Regular.ttf
        - asset: assets/fonts/comicrelief/ComicRelief-Bold.ttf
          weight: 700
    - family: MaterialDings
      fonts:
        - asset: assets/fonts/materialdings/MaterialDings.ttf

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
